name: HASSAN SMART RADAR

on:
  workflow_dispatch:
  schedule:
    - cron: '30-55/5 16 * * 1-5'
      timezone: Asia/Riyadh
    - cron: '*/5 17 * * 1-5'
      timezone: Asia/Riyadh
    - cron: '0,10,20,30,40,50 17-22 * * 1-5'
      timezone: Asia/Riyadh
    - cron: '0 23 * * 1-5'
      timezone: Asia/Riyadh

permissions:
  contents: write

concurrency:
  group: hassan-smart-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: تثبيت المكتبات
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: تشغيل الرادار
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
        run: python scanner.py
      - name: حفظ حالة التنبيهات
        run: |
          git config user.name "HASSAN SMART RADAR"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smart_radar_state.json
          if git diff --cached --quiet; then
            echo "لا توجد تغييرات"
          else
            git commit -m "Update smart radar state"
            git push
          fi
